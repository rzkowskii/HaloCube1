newmenu [Halo Campaign]
menuitem "Resume" [closecurmenu]
menuitem "Restart section" [closecurmenu; halo_restart]
menuitem "Mission select" [showmenu [Halo Missions]]
menuitem "Difficulty" [showmenu [Halo Difficulty]]
menuitem "Settings" [showmenu Settings]
menuitem "Quit" [quit]

bind ESCAPE [halo_pause]
specbind ESCAPE [halo_pause]
bind F5 [halo_restart]
specbind F5 [halo_restart]
bind Q [halo_switch]
bind F [halo_melee]
bind G [halo_frag]
bind 1 [halo_slot 1]
bind 2 [halo_slot 2]
bind RETURN [halo_next]
bind E [halo_use]
bind MOUSE2 [halo_zoom]
bind Z [halo_zoom]

newmenu [Halo Difficulty]
menuitem "Easy" [halo_difficulty 0]
menuitem "Normal" [halo_difficulty 1]
menuitem "Heroic" [halo_difficulty 2]
menuitem "Legendary" [halo_difficulty 3]

newmenu [Halo Missions]
menuitem "The Pillar of Autumn" [halo_mission 1]
menuitem "Halo" [halo_mission 2]
menuitem "The Truth and Reconciliation" [halo_mission 3]
menuitem "The Silent Cartographer" [halo_mission 4]
menuitem "Assault on the Control Room" [halo_mission 5]
menuitem "343 Guilty Spark" [halo_mission 6]
menuitem "The Library" [halo_mission 7]
menuitem "Two Betrayals" [halo_mission 8]
menuitem "Keyes" [halo_mission 9]
menuitem "The Maw" [halo_mission 10]
