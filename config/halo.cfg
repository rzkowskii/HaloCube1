// Title menu (halo_title, shown when the game launches). Rebuilt each time it opens, so the
// Continue entry and the progress warning are current.
newmenu [Halo]
menuinit [
    resetcurmenu
    menuheader (halo_progress_note) ""
    if (halo_can_continue) [
        menuitem (concat "Continue:" (halo_continue_label)) [halo_continue]
    ] [
        menuitemgreyedout 1
        menuitem "Continue" -1
        menuitemgreyedout 0
    ]
    menuitem "New Game" [showmenu [Halo New Game]]
    menuitem "Mission select" [showmenu [Halo Missions]]
    menuitem "Settings" [showmenu Settings]
    menuitem "Quit" [quit]
]

newmenu [Halo New Game]
menuinit [
    if (halo_can_continue) [menuheader "Choose a difficulty. A new game replaces the saved game." ""] [menuheader "Choose a difficulty" ""]
    menuinitselection $halo_difficulty
]
menuitem "Easy" [halo_new_game 0]
menuitem "Normal" [halo_new_game 1]
menuitem "Heroic" [halo_new_game 2]
menuitem "Legendary" [halo_new_game 3]

// In-game pause menu.
newmenu [Halo Campaign]
// The header carries the last warning about the saved game (a Continue that restarted the script).
menuinit [menuheader (halo_progress_note) ""]
menuitem "Resume" [closecurmenu]
menuitem "Restart section" [closecurmenu; halo_restart]
menuitem "Mission select" [showmenu [Halo Missions]]
menuitem "Difficulty" [showmenu [Halo Difficulty]]
menuitem "Settings" [showmenu Settings]
menuitem "Main menu" [halo_title]
menuitem "Quit" [quit]

bind ESCAPE [halo_pause]
specbind ESCAPE [halo_pause]
bind F5 [halo_restart]
specbind F5 [halo_restart]
bind Q [halo_switch]
bind F [halo_melee]
bind G [halo_frag]
bind H [halo_grenade_switch]
bind 1 [halo_slot 1]
bind 2 [halo_slot 2]
bind RETURN [halo_next]
bind E [halo_use]
// E is Halo's action key in the campaign; edit mode (fly through walls, scripts paused) is on F8.
bind F8 [edittoggle]
editbind F8 [edittoggle]
bind MOUSE2 [halo_zoom]
bind Z [halo_zoom]
bind X [halo_flashlight]

newmenu [Halo Difficulty]
menuinit [menuinitselection $halo_difficulty]
menuitem "Easy" [halo_difficulty 0]
menuitem "Normal" [halo_difficulty 1]
menuitem "Heroic" [halo_difficulty 2]
menuitem "Legendary" [halo_difficulty 3]

// Mission select: the missions reached so far (every one once the campaign is beaten), then a
// difficulty. Locked and not yet imported missions are listed greyed out.
newmenu [Halo Missions]
menuinit [
    resetcurmenu
    loop i 10 [
        halo_menu_mission = (+ $i 1)
        halo_menu_state = (halo_mission_state $halo_menu_mission)
        if (= $halo_menu_state 1) [
            menuitem (halo_mission_title $halo_menu_mission) (concat halo_pick_mission $halo_menu_mission)
        ] [
            menuitemgreyedout 1
            if (= $halo_menu_state 2) [
                menuitem (concat (halo_mission_title $halo_menu_mission) "(not imported)") -1
            ] [
                menuitem (concat (halo_mission_title $halo_menu_mission) "(locked)") -1
            ]
            menuitemgreyedout 0
        ]
    ]
]

halo_picked_mission = 1
halo_pick_mission = [
    halo_picked_mission = $arg1
    showmenu [Halo Mission Difficulty]
]

newmenu [Halo Mission Difficulty]
menuinit [
    menuheader (halo_mission_title $halo_picked_mission) ""
    menuinitselection $halo_difficulty
]
menuitem "Easy" [halo_difficulty 0; halo_mission $halo_picked_mission]
menuitem "Normal" [halo_difficulty 1; halo_mission $halo_picked_mission]
menuitem "Heroic" [halo_difficulty 2; halo_mission $halo_picked_mission]
menuitem "Legendary" [halo_difficulty 3; halo_mission $halo_picked_mission]
