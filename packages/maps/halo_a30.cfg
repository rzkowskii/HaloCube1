// A30 opening encounter, imported from Halo CE's original Xbox cache.
texturereset
texture 1 "halo_a30/cliff.png" // Reserved sky slot
texture 1 "halo_a30/water.png"
texture 0.40 "halo_a30/cliff.png"
texture 0.75 "halo_a30/grass.png"
texture 0.45 "halo_a30/dirt.png"
texture 0.75 "halo_a30/metal.png"
texture 0.75 "halo_a30/moss.png"
loadsky "halo_a30/dusk"
fog 430
fogcolour 0x6b7f9b

// Mapmodel slots: tools/import_halo_campaign.py checks these lines. With the scenery's real collision
// in halo_a30.hcol (SCENERY_COLLISION) the models only draw: radius and height 0 turn their collision
// cylinders off. To go back to the cylinders, take the Crash Site out of SCENERY_COLLISION and put
// CRASH_SITE_MAPMODELS' sizes back here (1 14, 1 20, 1 4, 3 8, 1 4), then re-import the Crash Site.
mapmodelreset
mapmodel 0 0 0 1 "halo_a30/tree_pine"
mapmodel 0 0 0 1 "halo_a30/tree_pine_tall"
mapmodel 0 0 0 1 "halo_a30/boulder_granite_large"
mapmodel 0 0 0 1 "halo_a30/boulder_granite_gigantic"
mapmodel 0 0 0 1 "halo_a30/lifepod_crashed"
